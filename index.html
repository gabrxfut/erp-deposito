<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depósito El Costeño</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Lilita+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <svg viewBox="0 0 311.1 14.4" preserveAspectRatio="none" class="franja-vueltiao" aria-hidden="true">
            <polyline vector-effect="non-scaling-stroke" points="0.7,13.7 13.4,0.8 25.3,12.8 37.2,0.8 49,12.8 60.9,0.8 72.8,12.8 84.7,0.8 96.6,12.8 108.4,0.8
	120.3,12.8 132.2,0.8 144,12.8 155.9,0.8 167.7,12.8 179.8,0.7 191.7,12.8 203.6,0.8 215.4,12.8 227.3,0.8 239.2,12.8 251.1,0.8 
	262.9,12.8 274.8,0.8 286.7,12.8 298.6,0.8 310.4,12.8 "></polyline>
        </svg>
        <div class="panel-contenido">
            <img width="320" height="158" alt="Logo del Depósito El Costeño" class="logo" src="imagen/logo.jpeg">
            <h1 class="texto-blanco texto1">Facturación <br> e inventario</h1>
            <p class="texto-blanco">Víveres al por mayor y al detal &middot; San Luis de Sincé - Sucre, Colombia</p>
            <ul class="texto-blanco lista">
                <li class="etiqueta texto-negro etiqueta-facturar">Facturar</li>
                <li class="etiqueta texto-azul etiqueta-inventario">Inventario</li>
                <li class="etiqueta etiqueta-stock">Alertas de stock</li>
                <li class="etiqueta etiqueta-caja">Caja</li>
            </ul>
        </div>
    </header>
    <main class="main-sesion">
        <div class="formulario-sesion">
            <h2 class="texto-azul texto1">¡Buenas!</h2>
            <p>Entra con tu usuario para abrir la caja.</p>
            <form action="panel.html">
                <div class="campo">
                    <label for="usuario" class="texto-negro">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ej: gabriel">
                </div>
                <div class="campo">
                    <label for="clave" class="texto-negro">Contraseña</label>
                    <input type="password" id="clave">
                </div>
                <button type="submit" class="boton-azul boton texto1">Entrar</button>
            </form>
            <p>¿Olvidaste la contraseña? Pídele al administrador que la cambie.</p>
        </div>
    </main>
</body>

</html>
